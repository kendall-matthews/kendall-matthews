<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Kendall E. Matthews — From Strategy To Proof</title>
<desc id="desc">KEM editorial GitHub banner with forest green, ivory and bronze. Kendall E. Matthews name, From Strategy To Proof, a B2B value proposition and Build Something Undeniable. No bullseye.</desc>
<rect width="1200" height="300" rx="10" fill="#18453B"/>
<rect x="688" y="0" width="512" height="300" rx="10" fill="#F5F2E9"/>
<rect x="683" y="37" width="5" height="226" fill="#B89158"/>
<rect x="0" y="0" width="1200" height="5" fill="#B89158"/>
<text x="58" y="65" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="2.1" fill="#DDEAE4">KENDALL E. MATTHEWS</text>
<text x="54" y="151" font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" letter-spacing="-1.1" fill="#FFFFFF">From Strategy</text>
<text x="54" y="219" font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" letter-spacing="-1.1" fill="#FFFFFF">To Proof.</text>
<rect x="58" y="240" width="70" height="4" rx="2" fill="#B89158"/>
<text x="58" y="275" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" letter-spacing=".4" fill="#DDEAE4">Decide what matters. Go build the proof.</text>
<text x="724" y="88" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#171C19">I help B2B teams turn</text>
<text x="724" y="124" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#171C19">market complexity into</text>
<text x="724" y="160" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#171C19">campaigns that move</text>
<text x="724" y="196" font-family="Georgia,'Times New Roman',serif" font-size="27" font-weight="700" fill="#171C19">pipeline.</text>
<rect x="724" y="222" width="64" height="4" rx="2" fill="#B89158"/>
<text x="724" y="264" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="1.1" fill="#18453B">BUILD SOMETHING UNDENIABLE</text>
</svg>
